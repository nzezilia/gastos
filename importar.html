<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>Importar fatura</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--txt:#111827;--mut:#6b7280;--pri:#0f766e;--bd:#e5e7eb;--err:#b91c1c}
@media(prefers-color-scheme:dark){:root{--bg:#0b0f14;--card:#151b23;--txt:#e5e7eb;--mut:#9ca3af;--bd:#263040;--pri:#14b8a6;--err:#f87171}}
*{box-sizing:border-box}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
input[type=file]{width:100%;font-size:15px}
textarea{width:100%;padding:12px;font-size:13px;font-family:ui-monospace,Menlo,Consolas,monospace;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--txt)}
.btn{width:100%;padding:16px;margin-top:12px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:17px;font-weight:600}
.link{background:none;border:0;color:var(--mut);font-size:16px;padding:8px;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.mut{color:var(--mut);font-size:13px}
.chk{display:flex;align-items:center;gap:8px;color:var(--txt);font-size:14px}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
#toast.erro{background:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="ferramentas.html" class="link">← Voltar</a>
    <strong>Importar fatura</strong>
    <span style="width:70px"></span>
  </div>

  <div class="card">
    <div class="mut">Etapa de teste: o app lê o PDF aqui no celular (nada é enviado para a internet) e mostra o texto encontrado.</div>
    <label for="arq">Arquivo PDF da fatura</label>
    <input id="arq" type="file" accept="application/pdf">
    <label class="chk"><input type="checkbox" id="soValores" checked> Mostrar só linhas com valor (R$)</label>
    <div id="status" class="mut" style="margin-top:8px"></div>
  </div>

  <h2>Texto encontrado</h2>
  <div class="card">
    <textarea id="saida" readonly rows="14" placeholder="O texto da fatura vai aparecer aqui."></textarea>
    <button id="btnCopiar" class="btn">Copiar texto</button>
  </div>
</div>
<div id="toast"></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
<script>
pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
const $ = id => document.getElementById(id);
let paginas = [];

function toast(m, erro){
  const t = $('toast');
  t.textContent = m;
  t.className = erro ? 'show erro' : 'show';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.className = '', 2500);
}

function mostrar(){
  const re = /\d{1,3}(?:\.\d{3})*,\d{2}/;
  const filtro = $('soValores').checked;
  const partes = [];
  paginas.forEach((ls, i) => {
    partes.push('--- página ' + (i + 1) + ' ---');
    (filtro ? ls.filter(l => re.test(l)) : ls).forEach(l => partes.push(l));
  });
  $('saida').value = partes.join('\n');
}

async function lerPdf(file){
  $('status').textContent = 'Lendo...';
  $('saida').value = '';
  paginas = [];
  try {
    const buf = await file.arrayBuffer();
    const task = pdfjsLib.getDocument({data: buf});
    task.onPassword = (atualizar, motivo) => {
      const s = prompt(motivo === 2 ? 'Senha incorreta. Digite de novo:' : 'Este PDF tem senha. Digite a senha:');
      if(s === null){ task.destroy(); return; }
      atualizar(s);
    };
    const pdf = await task.promise;
    let total = 0;
    for(let p = 1; p <= pdf.numPages; p++){
      const page = await pdf.getPage(p);
      const tc = await page.getTextContent();
      const its = tc.items
        .filter(i => i.str.trim())
        .map(i => ({x: i.transform[4], y: i.transform[5], t: i.str.trim()}));
      its.sort((a, b) => b.y - a.y || a.x - b.x);
      const linhas = [];
      let atual = null;
      its.forEach(i => {
        if(!atual || Math.abs(atual.y - i.y) > 3){ atual = {y: i.y, itens: []}; linhas.push(atual); }
        atual.itens.push(i);
      });
      const textoLinhas = linhas.map(l => l.itens.sort((a, b) => a.x - b.x).map(i => i.t).join(' ').replace(/\s+/g, ' '));
      total += textoLinhas.length;
      paginas.push(textoLinhas);
    }
    if(total === 0){
      $('status').textContent = 'Nenhum texto encontrado. O PDF pode ser uma imagem.';
      return;
    }
    $('status').textContent = pdf.numPages + ' página(s) lida(s).';
    mostrar();
  } catch(e){
    $('status').textContent = 'Não consegui ler o PDF: ' + (e.message || e);
  }
}

$('arq').onchange = e => { if(e.target.files[0]) lerPdf(e.target.files[0]); };
$('soValores').onchange = mostrar;
$('btnCopiar').onclick = async () => {
  const t = $('saida').value;
  if(!t) return toast('Nada para copiar', true);
  try { await navigator.clipboard.writeText(t); toast('Copiado ✓'); }
  catch(e){ $('saida').select(); document.execCommand('copy'); toast('Copiado ✓'); }
};
</script>
</body>
</html>
