<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Início</title>
<link rel="stylesheet" href="estilo.css">
<link rel="stylesheet" href="componentes.css">
<script src="nav.js" defer></script>
<script src="editar.js" defer></script>
<script src="entradas.js" defer></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<style>
.car{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;-webkit-overflow-scrolling:touch}
.car::-webkit-scrollbar{display:none}
.car .slide{flex:0 0 100%;scroll-snap-align:center;display:flex}
.car .hero{width:100%;position:relative;display:flex;flex-direction:column}
.car .hero .hrow{margin-top:auto}
.hero .nx{position:absolute;top:16px;right:16px;font-size:20px;opacity:.7;cursor:pointer}
.hero.res .nx{right:auto;left:auto;right:16px}
.dots{display:flex;justify-content:center;gap:6px;margin-top:10px}
.dots i{width:6px;height:6px;border-radius:3px;background:var(--bd);transition:width .2s}
.dots i.on{width:18px;background:var(--pri)}
.res .rv{font-size:34px;font-weight:700;letter-spacing:-.02em;margin:2px 0 4px}
.res .rs{font-size:13px;opacity:.95;margin-bottom:12px}
.hbtn{align-self:flex-start;background:#fff;color:var(--pri);border:0;border-radius:999px;padding:8px 14px;font-weight:600;font-size:13px;margin-bottom:12px;cursor:pointer}
.fluxo{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:auto}
.fl{background:rgba(255,255,255,.16);border-radius:16px;padding:10px 12px;display:flex;align-items:center;gap:10px}
.fic{width:32px;height:32px;border-radius:50%;background:#fff;display:flex;align-items:center;justify-content:center;font-size:18px;flex:none}
.fic.in{color:#16a34a}
.fic.out{color:#dc2626}
.fl small{display:block;font-size:11px;opacity:.85}
.fl b{font-size:14px}
.stat .sub{font-size:12px;font-weight:600;margin-top:6px;color:#0f766e}
.stat .sub.neg{color:var(--err)}
@media(prefers-color-scheme:dark){.stat .sub{color:#2dd4bf}}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div class="mesnav">
      <button id="ant" aria-label="Mês anterior"><i class="ti ti-chevron-left"></i></button>
      <span id="mesLabel"></span>
      <button id="prox" aria-label="Próximo mês"><i class="ti ti-chevron-right"></i></button>
    </div>
    <button id="btnSair" class="ib" aria-label="Sair"><i class="ti ti-logout"></i></button>
  </div>

  <div class="car" id="car">
    <div class="slide">
      <div class="hero">
        <i class="ti ti-chevron-right nx" id="nx" aria-hidden="true"></i>
        <div class="hl">Gasto do mês</div>
        <div class="hv" id="hTotal">R$ 0,00</div>
        <div class="hrow">
          <div class="hc" id="hCmp"></div>
          <svg id="hSpark" width="120" height="40" viewBox="0 0 120 40" role="img" aria-label="Gastos dos últimos seis meses"></svg>
        </div>
      </div>
    </div>
    <div class="slide">
      <div class="hero res">
        <i class="ti ti-chevron-left nx" id="pv" aria-hidden="true"></i>
        <div class="hl">Resultado do mês</div>
        <div class="rv" id="rVal">—</div>
        <div class="rs" id="rSub"></div>
        <button id="btnEnt" class="hbtn" hidden>Registrar entrada</button>
        <div class="fluxo">
          <div class="fl"><span class="fic in"><i class="ti ti-arrow-down"></i></span><div><small>Entradas</small><b id="fEnt">R$ 0,00</b></div></div>
          <div class="fl"><span class="fic out"><i class="ti ti-arrow-up"></i></span><div><small>Saídas</small><b id="fSai">R$ 0,00</b></div></div>
        </div>
      </div>
    </div>
  </div>
  <div class="dots" id="dots"><i class="on"></i><i></i></div>

  <div class="stats">
    <div class="stat" id="stDia"><small id="stDiaL">Posso gastar por dia</small><b id="stDiaV">—</b><div class="sub" id="stDiaH" hidden></div></div>
    <div class="stat" id="stOrc"><small>Orçamento usado</small><b id="stOrcV">—</b><div class="mini"><i id="stOrcBar"></i></div></div>
  </div>

  <h2>Categorias</h2>
  <div class="card" id="cats"></div>

  <h2>Últimas transações <a class="vt" href="transacoes.html">Ver todas</a></h2>
  <div class="card" id="ult"></div>

  <a class="linkcard" href="resumo.html">Ver análises, calendário e dicas →</a>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script src="util.js"></script>
<script>
const SUPABASE_URL = 'https://rgxtcesazjjongzzundn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dcaO4K5PeljI7vogQHQaxg_3hH_pIGT';
const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let mes = hoje().slice(0, 8) + '01';
let janela = [];
let dados = [];
let entradas = [];
let limite = 0;
let uid = null;
let tok = 0;

async function buscarPeriodo(ini, fim){
  let tudo = [], de = 0;
  while(true){
    const r = await db.from('gastos')
      .select('id,data,valor,categoria,meio_pagamento,descricao,parcelas,parcela_numero,titular')
      .gte('data', ini).lt('data', fim)
      .order('data', {ascending: false}).order('criado_em', {ascending: false}).order('id')
      .range(de, de + 999);
    if(r.error){ toast('Erro: ' + r.error.message, true); return null; }
    tudo = tudo.concat(r.data);
    if(r.data.length < 1000) break;
    de += 1000;
  }
  return tudo;
}

async function buscarEntradas(ini, fim){
  const r = await db.from('entradas')
    .select('id,data,valor,categoria,descricao,recorrente_id,criado_em')
    .gte('data', ini).lt('data', fim)
    .order('data', {ascending: false}).order('criado_em', {ascending: false});
  return r.error ? [] : r.data;
}

function desenharSpark(vals){
  const svg = $('hSpark');
  svg.innerHTML = '';
  const max = Math.max(...vals, 1), W = 120, H = 40, P = 5;
  const pts = vals.map((v, i) => [P + i * (W - 2 * P) / (vals.length - 1), H - P - (v / max) * (H - 2 * P)]);
  const NS = 'http://www.w3.org/2000/svg';
  const pl = document.createElementNS(NS, 'polyline');
  pl.setAttribute('points', pts.map(p => p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' '));
  pl.setAttribute('fill', 'none');
  pl.setAttribute('stroke', 'rgba(255,255,255,.85)');
  pl.setAttribute('stroke-width', '2');
  pl.setAttribute('stroke-linecap', 'round');
  pl.setAttribute('stroke-linejoin', 'round');
  svg.appendChild(pl);
  const u = pts[pts.length - 1];
  const c = document.createElementNS(NS, 'circle');
  c.setAttribute('cx', u[0]);
  c.setAttribute('cy', u[1]);
  c.setAttribute('r', '3.5');
  c.setAttribute('fill', '#fff');
  svg.appendChild(c);
}

function render(){
  const mm = mes.slice(0, 7), hj = hoje();
  const ehAtual = mm === hj.slice(0, 7);
  const futuro = mm > hj.slice(0, 7);
  dados = janela.filter(x => x.data.slice(0, 7) === mm);
  const totMes = soma(dados);

  $('hTotal').textContent = brl(totMes);

  const meses = [];
  for(let k = -5; k <= 0; k++) meses.push(addMeses(mes, k).slice(0, 7));
  const totais = meses.map(m => soma(janela.filter(x => x.data.slice(0, 7) === m)));
  desenharSpark(totais);

  const mmPrev = meses[4];
  let cur = totais[5], prev = totais[4], ate = 0;
  if(ehAtual){
    ate = +hj.slice(8, 10);
    const diasPrev = new Date(+mmPrev.slice(0, 4), +mmPrev.slice(5, 7), 0).getDate();
    const corte = Math.min(ate, diasPrev);
    cur = soma(dados.filter(x => x.data <= hj));
    prev = soma(janela.filter(x => x.data.slice(0, 7) === mmPrev && +x.data.slice(8, 10) <= corte));
  }
  const cmp = $('hCmp');
  cmp.innerHTML = '';
  const nomePrev = nomeMes(mmPrev + '-01', 'long');
  if(prev === 0){
    cmp.textContent = 'Sem gastos em ' + nomePrev + ' para comparar';
  } else {
    const dif = cur - prev;
    const pct = Math.abs(dif) / prev * 100;
    if(pct < 1){
      cmp.textContent = 'Praticamente igual a ' + nomePrev + (ate ? ' (até o dia ' + ate + ')' : '');
    } else {
      const ic = document.createElement('i');
      ic.className = 'ti ti-arrow-' + (dif > 0 ? 'up' : 'down') + '-right';
      cmp.appendChild(ic);
      cmp.appendChild(document.createTextNode(' ' + Math.round(pct) + '% ' + (dif > 0 ? 'a mais' : 'a menos') +
        ' que em ' + nomePrev + (ate ? ' (até o dia ' + ate + ')' : '')));
    }
  }

  const entMes = soma(entradas);
  const res = entMes - totMes;
  $('fEnt').textContent = brl(entMes);
  $('fSai').textContent = brl(totMes);
  if(entMes > 0){
    $('rVal').textContent = brl(res);
    $('rSub').textContent = res >= 0
      ? 'Você guardou ' + Math.round(res / entMes * 100) + '% das entradas'
      : 'As saídas passam das entradas em ' + brl(-res);
    $('btnEnt').hidden = true;
  } else {
    $('rVal').textContent = '—';
    $('rSub').textContent = 'Nenhuma entrada neste mês.';
    $('btnEnt').hidden = false;
  }

   const lDia = $('stDiaL'), vDia = $('stDiaV'), hDia = $('stDiaH'), vOrc = $('stOrcV'), bOrc = $('stOrcBar');
  vDia.className = '';
  hDia.hidden = true;
  hDia.className = 'sub';
  if(!(limite > 0)){
    lDia.textContent = 'Orçamento';
    vDia.textContent = 'Definir limite';
    vOrc.textContent = '—';
    bOrc.style.width = '0';
  } else {
    const p = totMes / limite * 100;
    vOrc.textContent = Math.round(p) + '%';
    bOrc.style.width = Math.min(p, 100) + '%';
    bOrc.style.background = p > 100 ? '#dc2626' : p >= 80 ? '#d97706' : '#16a34a';
    if(ehAtual){
      lDia.textContent = 'Posso gastar por dia';
      const dia = +hj.slice(8, 10);
      const diasMes = new Date(+hj.slice(0, 4), +hj.slice(5, 7), 0).getDate();
      const R = diasMes - dia + 1;
      const H = soma(dados.filter(x => x.data === hj));
      const restante = limite - totMes;
      if(restante <= 0){ vDia.textContent = 'Esgotado'; vDia.className = 'neg'; }
      else vDia.textContent = brl(restante / R);
      const baseDia = (limite - (totMes - H)) / R;
      const disp = baseDia - H;
      hDia.hidden = false;
      if(disp > 0.005){
        hDia.textContent = 'Disponível hoje: ' + brl(disp);
      } else {
        hDia.className = 'sub neg';
        hDia.textContent = 'Disponível hoje: ' + brl(0);
      }
    } else if(futuro){
      lDia.textContent = 'Posso gastar por dia';
      vDia.textContent = '—';
    } else {
      lDia.textContent = 'Resultado do mês';
      if(totMes <= limite) vDia.textContent = 'Sobrou ' + brl(limite - totMes);
      else { vDia.textContent = 'Passou ' + brl(totMes - limite); vDia.className = 'neg'; }
    }
  }

  const porCat = {};
  dados.forEach(x => { porCat[x.categoria] = (porCat[x.categoria] || 0) + Number(x.valor); });
  const arr = Object.entries(porCat).sort((a, b) => b[1] - a[1]);
  const box = $('cats');
  box.innerHTML = '';
  if(!arr.length){
    box.textContent = 'Sem gastos neste mês.';
  } else {
    arr.slice(0, 5).forEach(([c, v]) => {
      const pct = totMes ? v / totMes * 100 : 0;
      const row = document.createElement('div');
      row.className = 'catrow';
      const ic = document.createElement('div');
      ic.className = 'ic';
      ic.style.background = 'color-mix(in srgb, ' + corCat(c) + ' 16%, transparent)';
      ic.style.color = corCat(c);
      const i = document.createElement('i');
      i.className = 'ti ti-' + iconeCat(c);
      ic.appendChild(i);
      const mid = document.createElement('div');
      mid.className = 'mid';
      const l1 = document.createElement('div');
      l1.className = 'l1';
      const n = document.createElement('span');
      n.textContent = c;
      const p = document.createElement('span');
      p.className = 'pc';
      p.textContent = Math.round(pct) + '%';
      l1.appendChild(n); l1.appendChild(p);
      const l2 = document.createElement('div');
      l2.className = 'l2';
      l2.textContent = brl(v);
      const bar = document.createElement('div');
      bar.className = 'bar';
      const bi = document.createElement('i');
      bi.style.width = Math.max(pct, 2) + '%';
      bi.style.background = corCat(c);
      bar.appendChild(bi);
      mid.appendChild(l1); mid.appendChild(l2); mid.appendChild(bar);
      row.appendChild(ic); row.appendChild(mid);
      box.appendChild(row);
    });
    if(arr.length > 5){
      const resto = arr.slice(5);
      const nota = document.createElement('div');
      nota.className = 'mut';
      nota.style.marginTop = '6px';
      nota.textContent = '+ outras ' + resto.length + ' categoria' + (resto.length > 1 ? 's' : '') + ' · ' + brl(resto.reduce((s, x) => s + x[1], 0));
      box.appendChild(nota);
    }
  }

  const ult = $('ult');
  const mistos = dados.concat(entradas.map(e => Object.assign({_e: true}, e)))
    .sort((a, b) => a.data < b.data ? 1 : a.data > b.data ? -1 : 0);
  if(!mistos.length){
    ult.textContent = 'Nenhum lançamento neste mês. Toque no + para lançar.';
  } else {
    (window.agruparMisto || agruparPorData)(mistos.slice(0, 6), carregar, ult);
  }
}

async function carregar(){
  const t = ++tok;
  $('mesLabel').textContent = nomeMes(mes, 'long') + ' ' + mes.slice(0, 4);
  const r = await buscarPeriodo(addMeses(mes, -5), addMeses(mes, 1));
  const e = await buscarEntradas(mes, addMeses(mes, 1));
  if(t !== tok || !r) return;
  janela = r;
  entradas = e;
  render();
}

async function editarLimite(){
  const s = prompt('Limite mensal (R$)', limite || '');
  if(s === null) return;
  const v = num(s);
  const {error} = await db.from('orcamento').upsert({user_id: uid, limite_mensal: v});
  if(error) return toast('Erro: ' + error.message, true);
  limite = v;
  render();
  toast('Limite salvo ✓');
}

function irParaSlide(i){
  const c = $('car');
  c.scrollTo({left: i * (c.clientWidth + 12), behavior: 'smooth'});
}

$('ant').onclick = () => { mes = addMeses(mes, -1); carregar(); };
$('prox').onclick = () => { mes = addMeses(mes, 1); carregar(); };
$('stDia').onclick = editarLimite;
$('stOrc').onclick = editarLimite;
$('btnSair').onclick = async () => { await db.auth.signOut(); location.href = 'index.html'; };
$('nx').onclick = () => irParaSlide(1);
$('pv').onclick = () => irParaSlide(0);
$('btnEnt').onclick = () => { if(window.abrirNovaEntrada) window.abrirNovaEntrada(carregar); };
$('car').addEventListener('scroll', () => {
  const c = $('car');
  const i = Math.round(c.scrollLeft / (c.clientWidth + 12));
  document.querySelectorAll('#dots i').forEach((d, k) => d.classList.toggle('on', k === i));
}, {passive: true});

document.addEventListener('visibilitychange', () => { if(!document.hidden && uid) carregar(); });
(async () => {
  const {data} = await db.auth.getSession();
  if(!data.session){ location.href = 'index.html'; return; }
  uid = data.session.user.id;
  const o = await db.from('orcamento').select('limite_mensal').eq('user_id', uid).maybeSingle();
  if(!o.error && o.data) limite = Number(o.data.limite_mensal);
  await carregarCartoes();
  carregar();
})();
</script>
</body>
</html>
