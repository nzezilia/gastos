<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#4f46e5">
<title>Resumo</title>
<link rel="stylesheet" href="estilo.css">
<script src="nav.js" defer></script>
<script src="editar.js" defer></script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--pri:#4f46e5;--bd:#e4e7f1;--err:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0a0c16;--card:#12162a;--txt:#e8eaf6;--mut:#98a2c3;--bd:#23294a;--pri:#6366f1;--err:#f87171}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h2{font-size:16px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--card);color:var(--txt)}
.link{background:none;border:0;color:var(--mut);font-size:16px;padding:8px;cursor:pointer;text-decoration:none}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.nav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.nav button{font-size:26px;padding:4px 16px}
#mesLabel{font-size:17px;font-weight:600;text-transform:capitalize}
.filtros{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:12px}
.tag{padding:8px 14px;border-radius:999px;background:var(--pri);color:#fff;border:0;font-size:14px;margin-bottom:12px}
.total{font-size:32px;font-weight:700}
.mut{color:var(--mut);font-size:13px}
.cmp{font-size:13px;margin-top:8px;color:var(--mut)}
.cmp.up{color:var(--err)}
.cmp.down{color:#16a34a}
.barra{height:10px;background:var(--bd);border-radius:999px;overflow:hidden;margin:10px 0 6px}
.barra i{display:block;height:100%;width:0;background:#16a34a}
.barra.warn i{background:#d97706}
.barra.over i{background:#dc2626}
.hist{display:flex;align-items:flex-end;gap:6px;height:150px}
.hcol{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;background:none;border:0;padding:0;color:var(--txt);cursor:pointer;height:100%}
.hv{font-size:10px;color:var(--mut);white-space:nowrap}
.hb{width:100%;max-width:34px;border-radius:8px 8px 4px 4px;background:color-mix(in srgb,var(--pri) 30%,transparent)}
.hcol.sel .hb{background:var(--pri)}
.hn{font-size:12px;color:var(--mut);text-transform:capitalize}
.hcol.sel .hn{color:var(--pri);font-weight:700}
.abas{display:flex;gap:8px;margin-bottom:8px}
.aba{flex:1;padding:10px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:15px}
.aba.on{background:var(--pri);border-color:var(--pri);color:#fff}
.row{margin:12px 0}
.row.clk{cursor:pointer}
.row .l{display:flex;justify-content:space-between;font-size:14px;gap:8px}
.row.sel .l{font-weight:700;color:var(--pri)}
.row .b{height:8px;background:var(--bd);border-radius:999px;margin-top:4px;overflow:hidden}
.row .b i{display:block;height:100%;background:var(--pri)}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item small{color:var(--mut);display:block}
.item .v{font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
#toast.erro{background:var(--err)}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a href="index.html" class="link">← Lançar</a>
    <strong>Resumo</strong>
    <span style="width:70px"></span>
  </div>

  <div class="nav">
    <button id="ant" class="link">‹</button>
    <div id="mesLabel"></div>
    <button id="prox" class="link">›</button>
  </div>

  <div class="filtros">
    <select id="fCat"></select>
    <select id="fMeio"></select>
  </div>
  <div id="diaTag" hidden><button id="btnLimparDia" class="tag"></button></div>

  <div class="card">
    <div class="mut" id="totLabel">Total do mês</div>
    <div class="total" id="total">R$ 0,00</div>
    <div class="mut" id="rec"></div>
    <div class="cmp" id="cmp"></div>
  </div>

  <div class="card" style="margin-top:12px">
    <div style="display:flex;justify-content:space-between;align-items:center">
      <strong>Orçamento do mês</strong>
      <button id="btnLimite" class="link" style="font-size:14px">Editar limite</button>
    </div>
    <div id="orcTxt" style="margin-top:6px"></div>
    <div id="orcBarra" class="barra"><i></i></div>
    <div id="orcRest" class="mut"></div>
  </div>

  <h2>Últimos 6 meses</h2>
  <div class="card">
    <div id="hist" class="hist"></div>
    <div class="mut" style="margin-top:8px">Valores em R$. Toque em um mês para abri-lo.</div>
  </div>

  <h2>Análise</h2>
  <div class="card">
    <div class="abas">
      <button class="aba on" data-aba="cat">Categorias</button>
      <button class="aba" data-aba="meio">Onde</button>
      <button class="aba" data-aba="dia">Dias</button>
    </div>
    <div id="grafico"></div>
  </div>

  <h2>Lançamentos</h2>
  <div class="mut" style="margin:-4px 0 8px">Toque em um lançamento para editar ou apagar.</div>
  <div id="lista"></div>
</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://rgxtcesazjjongzzundn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dcaO4K5PeljI7vogQHQaxg_3hH_pIGT';
const CATEGORIAS = ['Mercado','Alimentação','Transporte','Moradia','Saúde','Lazer','Educação','Assinaturas','Compras','Outros'];

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);

function hoje(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addMeses(s, n){
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(Math.min(d, ult)).padStart(2,'0');
}
const brl = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
function num(s){
  s = (s || '').trim();
  s = s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s;
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function toast(m, erro){
  const t = $('toast');
  t.textContent = m;
  t.className = erro ? 'show erro' : 'show';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.className = '', 2500);
}
function fmtDia(s){ const [y, m, d] = s.split('-'); return d + '/' + m; }
function rotuloDia(s){
  const [y, m, d] = s.split('-').map(Number);
  const sem = new Date(y, m - 1, d).toLocaleDateString('pt-BR', {weekday:'short'}).replace('.', '');
  return String(d).padStart(2, '0') + '/' + String(m).padStart(2, '0') + ' · ' + sem;
}
function nomeMes(s, formato){
  return new Date(+s.slice(0,4), +s.slice(5,7) - 1, 1).toLocaleDateString('pt-BR', {month: formato}).replace('.', '');
}

let mes = hoje().slice(0,8) + '01';
let dados = [];
let hist = [];
let histPronto = false;
let tokHist = 0;
let limite = 0;
let meiosBase = [];
let uid = null;
let aba = 'cat';
let diaSel = '';

function opcoes(sel, base, extras, rotulo){
  const atual = sel.value;
  const lista = [...new Set([...base, ...extras])];
  sel.innerHTML = '';
  const o0 = document.createElement('option');
  o0.value = ''; o0.textContent = rotulo;
  sel.appendChild(o0);
  lista.forEach(n => {
    const o = document.createElement('option');
    o.value = n; o.textContent = n;
    sel.appendChild(o);
  });
  sel.value = lista.includes(atual) ? atual : '';
}

const soma = a => a.reduce((s, x) => s + Number(x.valor), 0);

function agrupar(a, campo){
  const m = {};
  a.forEach(x => { m[x[campo]] = (m[x[campo]] || 0) + Number(x.valor); });
  return Object.entries(m).sort((p, q) => q[1] - p[1]);
}

function filtrar(comDia){
  const fc = $('fCat').value, fm = $('fMeio').value;
  return dados.filter(x =>
    (!fc || x.categoria === fc) &&
    (!fm || x.meio_pagamento === fm) &&
    (!comDia || !diaSel || x.data === diaSel));
}

function barras(el, pares, total, opt){
  el.innerHTML = '';
  if(!pares.length){ el.textContent = 'Sem gastos.'; return; }
  pares.forEach(([chave, v]) => {
    const pct = total ? v / total * 100 : 0;
    const row = document.createElement('div');
    row.className = 'row' + (opt && opt.onClick ? ' clk' : '') + (opt && opt.sel === chave ? ' sel' : '');
    if(opt && opt.onClick) row.onclick = () => opt.onClick(chave);
    const l = document.createElement('div');
    l.className = 'l';
    const a = document.createElement('span');
    a.textContent = opt && opt.rotulo ? opt.rotulo(chave) : chave;
    const b = document.createElement('span');
    b.textContent = brl(v) + ' · ' + Math.round(pct) + '%';
    l.appendChild(a); l.appendChild(b);
    const barra = document.createElement('div');
    barra.className = 'b';
    const i = document.createElement('i');
    i.style.width = pct + '%';
    barra.appendChild(i);
    row.appendChild(l); row.appendChild(barra);
    el.appendChild(row);
  });
}

/* ---------- Últimos 6 meses e comparação ---------- */
async function buscarPeriodo(ini, fim){
  let tudo = [], de = 0;
  while(true){
    const r = await db.from('gastos')
      .select('data,valor,categoria,meio_pagamento')
      .gte('data', ini).lt('data', fim)
      .order('data').order('id')
      .range(de, de + 999);
    if(r.error) return null;
    tudo = tudo.concat(r.data);
    if(r.data.length < 1000) break;
    de += 1000;
  }
  return tudo;
}

async function carregarHist(){
  const t = ++tokHist;
  const r = await buscarPeriodo(addMeses(mes, -5), addMeses(mes, 1));
  if(t !== tokHist) return;
  hist = r || [];
  histPronto = true;
  renderHist();
}

function renderHist(){
  const box = $('hist'), cmp = $('cmp');
  if(!histPronto){
    box.textContent = 'Carregando...';
    cmp.textContent = '';
    cmp.className = 'cmp';
    return;
  }
  const fc = $('fCat').value, fm = $('fMeio').value;
  const rows = hist.filter(x => (!fc || x.categoria === fc) && (!fm || x.meio_pagamento === fm));
  const meses = [];
  for(let k = -5; k <= 0; k++) meses.push(addMeses(mes, k));
  const doMes = m => rows.filter(x => x.data.slice(0, 7) === m.slice(0, 7));
  const tot = meses.map(m => soma(doMes(m)));

  box.innerHTML = '';
  const max = Math.max(...tot, 1);
  meses.forEach((m, i) => {
    const col = document.createElement('button');
    col.type = 'button';
    col.className = 'hcol' + (i === 5 ? ' sel' : '');
    col.onclick = () => { if(i === 5) return; mes = m; diaSel = ''; carregar(); };
    const v = document.createElement('span');
    v.className = 'hv';
    v.textContent = Math.round(tot[i]).toLocaleString('pt-BR');
    const barra = document.createElement('span');
    barra.className = 'hb';
    barra.style.height = Math.max(4, tot[i] / max * 100) + 'px';
    const n = document.createElement('span');
    n.className = 'hn';
    n.textContent = nomeMes(m, 'short');
    col.appendChild(v); col.appendChild(barra); col.appendChild(n);
    box.appendChild(col);
  });

  const hj = hoje();
  const ehMesAtual = mes.slice(0, 7) === hj.slice(0, 7);
  const mesPrev = meses[4];
  let cur, prev, ate = 0;
  if(ehMesAtual){
    ate = +hj.slice(8, 10);
    const diasPrev = new Date(+mesPrev.slice(0, 4), +mesPrev.slice(5, 7), 0).getDate();
    const corte = Math.min(ate, diasPrev);
    cur = soma(doMes(mes).filter(x => x.data <= hj));
    prev = soma(doMes(mesPrev).filter(x => +x.data.slice(8, 10) <= corte));
  } else {
    cur = tot[5];
    prev = tot[4];
  }

  cmp.innerHTML = '';
  const nomePrev = nomeMes(mesPrev, 'long');
  if(prev === 0){
    cmp.className = 'cmp';
    cmp.textContent = 'Sem gastos em ' + nomePrev + (ate ? ' até o dia ' + ate : '') + ' para comparar.';
    return;
  }
  const dif = cur - prev;
  const pct = Math.abs(dif) / prev * 100;
  if(pct < 1){
    cmp.className = 'cmp';
    cmp.textContent = 'Praticamente igual a ' + nomePrev + (ate ? ' (até o dia ' + ate + ')' : '') + '.';
    return;
  }
  const subiu = dif > 0;
  cmp.className = 'cmp ' + (subiu ? 'up' : 'down');
  const ic = document.createElement('i');
  ic.className = 'ti ti-trending-' + (subiu ? 'up' : 'down');
  cmp.appendChild(ic);
  cmp.appendChild(document.createTextNode(
    ' ' + Math.round(pct) + '% ' + (subiu ? 'a mais' : 'a menos') + ' que em ' + nomePrev +
    (ate ? ', comparando até o dia ' + ate : '') +
    ' (' + brl(Math.abs(dif)) + (subiu ? ' a mais' : ' a menos') + ')'
  ));
}

function render(){
  const f = filtrar(true);
  const tot = soma(f), totMes = soma(dados);
  const filtrado = $('fCat').value || $('fMeio').value || diaSel;

  $('totLabel').textContent = filtrado ? 'Total (filtrado)' : 'Total do mês';
  $('total').textContent = brl(tot);
  const rec = f.reduce((s, x) => s + Number(x.recompensa || 0), 0);
  $('rec').textContent = rec > 0 ? 'Recompensas: ' + brl(rec) : '';

  $('diaTag').hidden = !diaSel;
  if(diaSel) $('btnLimparDia').textContent = 'Dia ' + fmtDia(diaSel) + ' ✕';

  const barra = $('orcBarra');
  const i = barra.querySelector('i');
  if(limite > 0){
    const p = totMes / limite * 100;
    barra.className = 'barra ' + (p > 100 ? 'over' : p >= 80 ? 'warn' : '');
    i.style.width = Math.min(p, 100) + '%';
    $('orcTxt').textContent = brl(totMes) + ' de ' + brl(limite) + ' (' + Math.round(p) + '%)';
    $('orcRest').textContent = totMes <= limite ? 'Restam ' + brl(limite - totMes) : 'Estourou em ' + brl(totMes - limite);
  } else {
    barra.className = 'barra';
    i.style.width = '0';
    $('orcTxt').textContent = 'Nenhum limite definido';
    $('orcRest').textContent = '';
  }

  renderHist();

  document.querySelectorAll('.aba').forEach(b => b.classList.toggle('on', b.dataset.aba === aba));
  const gr = $('grafico');
  if(aba === 'cat') barras(gr, agrupar(f, 'categoria'), tot);
  else if(aba === 'meio') barras(gr, agrupar(f, 'meio_pagamento'), tot);
  else {
    const base = filtrar(false);
    const pares = agrupar(base, 'data').sort((p, q) => q[0].localeCompare(p[0]));
    barras(gr, pares, soma(base), {
      rotulo: rotuloDia,
      sel: diaSel,
      onClick: k => { diaSel = (diaSel === k ? '' : k); render(); }
    });
  }

  const lista = $('lista');
  lista.innerHTML = '';
  if(!f.length){ lista.textContent = 'Nenhum lançamento.'; return; }
  f.slice(0, 100).forEach(g => {
    const [y, m, d] = g.data.split('-');
    const item = document.createElement('div');
    item.className = 'item';
    item.style.cursor = 'pointer';
    item.onclick = () => abrirEdicao(g.id, carregar);
    const esq = document.createElement('div');
    const l1 = document.createElement('div');
    l1.textContent = g.categoria + ' · ' + g.meio_pagamento;
    const l2 = document.createElement('small');
    let t = d + '/' + m;
    if(g.parcelas > 1) t += ' · ' + g.parcela_numero + '/' + g.parcelas;
    if(g.descricao) t += ' · ' + g.descricao;
    l2.textContent = t;
    esq.appendChild(l1); esq.appendChild(l2);
    const v = document.createElement('div');
    v.className = 'v';
    v.textContent = brl(g.valor);
    item.appendChild(esq); item.appendChild(v);
    lista.appendChild(item);
  });
}

async function carregar(){
  histPronto = false;
  const fim = addMeses(mes, 1);
  $('mesLabel').textContent = new Date(+mes.slice(0,4), +mes.slice(5,7) - 1, 1)
    .toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const r = await db.from('gastos')
    .select('id,data,valor,categoria,meio_pagamento,descricao,parcelas,parcela_numero,recompensa')
    .gte('data', mes).lt('data', fim)
    .order('data', {ascending:false}).order('criado_em', {ascending:false});
  if(r.error){ toast('Erro: ' + r.error.message, true); return; }
  dados = r.data;
  opcoes($('fCat'), CATEGORIAS, dados.map(x => x.categoria), 'Todas as categorias');
  opcoes($('fMeio'), meiosBase, dados.map(x => x.meio_pagamento), 'Todos os meios');
  render();
  carregarHist();
}

async function init(){
  const {data} = await db.auth.getSession();
  if(!data.session){ location.href = 'index.html'; return; }
  uid = data.session.user.id;
  const o = await db.from('orcamento').select('limite_mensal').eq('user_id', uid).maybeSingle();
  if(!o.error && o.data) limite = Number(o.data.limite_mensal);
  const m = await db.from('meios_pagamento').select('nome').order('nome');
  if(!m.error) meiosBase = m.data.map(x => x.nome);
  carregar();
}

$('ant').onclick = () => { mes = addMeses(mes, -1); diaSel = ''; carregar(); };
$('prox').onclick = () => { mes = addMeses(mes, 1); diaSel = ''; carregar(); };
$('fCat').onchange = render;
$('fMeio').onchange = render;
$('btnLimparDia').onclick = () => { diaSel = ''; render(); };
document.querySelectorAll('.aba').forEach(b => { b.onclick = () => { aba = b.dataset.aba; render(); }; });
$('btnLimite').onclick = async () => {
  const s = prompt('Limite mensal (R$)', limite || '');
  if(s === null) return;
  const v = num(s);
  const {error} = await db.from('orcamento').upsert({user_id: uid, limite_mensal: v});
  if(error) return toast('Erro: ' + error.message, true);
  limite = v;
  render();
  toast('Limite salvo ✓');
};

init();
</script>
</body>
</html>
