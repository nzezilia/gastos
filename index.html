<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#1e3a8a">
<title>Gastos</title>
<link rel="stylesheet" href="estilo.css">
<script src="nav.js" defer></script>
<script src="editar.js" defer></script>
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Gastos">
<script>if('serviceWorker' in navigator)navigator.serviceWorker.register('sw.js')</script>
<style>
:root{--bg:#f4f5fb;--card:#fff;--txt:#0f172a;--mut:#64748b;--pri:#4f46e5;--bd:#e4e7f1;--err:#dc2626}
@media(prefers-color-scheme:dark){:root{--bg:#0a0c16;--card:#12162a;--txt:#e8eaf6;--mut:#98a2c3;--bd:#23294a;--pri:#6366f1;--err:#f87171}}
*{box-sizing:border-box}
[hidden]{display:none!important}
body{margin:0;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;background:var(--bg);color:var(--txt);padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
.wrap{max-width:480px;margin:0 auto;padding:16px}
h1{margin:8px 0 16px}
h2{font-size:16px;margin:24px 0 8px}
.card{background:var(--card);border:1px solid var(--bd);border-radius:16px;padding:16px}
label{display:block;font-size:13px;color:var(--mut);margin:14px 0 6px}
label:first-child{margin-top:0}
input,select{width:100%;padding:12px;font-size:16px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--txt)}
.big{font-size:32px;font-weight:700}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{padding:10px 14px;border-radius:999px;border:1px solid var(--bd);background:var(--card);color:var(--txt);font-size:15px}
.chip.on{background:var(--pri);border-color:var(--pri);color:#fff}
.chip.off{opacity:.45}
.chip .lg{width:22px;height:22px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:10px;font-weight:700;flex:none}
.btn{width:100%;padding:16px;margin-top:16px;border:0;border-radius:12px;background:var(--pri);color:#fff;font-size:18px;font-weight:600}
.btn:disabled{opacity:.6}
.link{background:none;border:0;color:var(--mut);font-size:14px;padding:8px}
summary{cursor:pointer;color:var(--pri);margin-top:14px}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:12px}
.total{font-size:28px;font-weight:700}
.mut{color:var(--mut);font-size:13px;text-transform:capitalize}
.err{color:var(--err);font-size:14px;min-height:18px}
.item{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--bd)}
.item small{color:var(--mut);display:block}
.item .dir{font-weight:600;white-space:nowrap}
#toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);background:#111827;color:#fff;padding:10px 16px;border-radius:10px;opacity:0;pointer-events:none;transition:opacity .2s;max-width:90%}
#toast.show{opacity:1}
#toast.erro{background:var(--err)}
</style>
</head>
<body>
<div class="wrap">

<section id="login" hidden>
  <h1>Gastos</h1>
  <div class="card">
    <label for="email">E-mail</label>
    <input id="email" type="email" autocomplete="username">
    <label for="senha">Senha</label>
    <input id="senha" type="password" autocomplete="current-password">
    <button id="btnLogin" class="btn">Entrar</button>
    <p id="erroLogin" class="err"></p>
  </div>
</section>

<section id="app" hidden>
  <div class="top">
    <div><div class="mut" id="mesLabel"></div><div class="total" id="total">R$ 0,00</div></div>
    <button id="btnSair" class="link">Sair</button>
  </div>
  <div class="card">
    <label for="valor">Valor (R$)</label>
    <input id="valor" class="big" inputmode="decimal" placeholder="0,00" autocomplete="off">
    <label>Conta</label>
    <div id="bancos" class="chips"></div>
    <label>Pagamento</label>
    <div id="formas" class="chips"></div>
    <div id="quemBox" hidden><label>Quem usou</label><div id="quem" class="chips"></div></div>
    <label>Categoria</label>
    <div id="cats" class="chips"></div>
    <label for="desc">Descrição (opcional)</label>
    <input id="desc" autocomplete="off">
    <div id="sugestoes" class="chips" style="margin-top:8px"></div>
    <details>
      <summary>Mais opções</summary>
      <label for="data">Data</label>
      <input id="data" type="date">
      <label for="parcelas">Parcelas</label>
      <input id="parcelas" type="number" min="1" max="48" value="1" inputmode="numeric">
      <label for="tipo">Tipo</label>
      <select id="tipo"><option value="variavel">Variável</option><option value="fixo">Fixo</option></select>
      <label for="rec">Recompensa (cashback, R$)</label>
      <input id="rec" inputmode="decimal" placeholder="0,00" autocomplete="off">
    </details>
    <button id="btnSalvar" class="btn">Salvar gasto</button>
  </div>
  <h2>Últimos lançamentos</h2>
  <div class="mut" style="text-transform:none;margin:-4px 0 8px">Toque em um lançamento para editar ou apagar.</div>
  <div id="lista"></div>
</section>

</div>
<div id="toast"></div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.1/dist/umd/supabase.js"></script>
<script>
const SUPABASE_URL = 'https://rgxtcesazjjongzzundn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_dcaO4K5PeljI7vogQHQaxg_3hH_pIGT';
const CATEGORIAS = ['Mercado','Alimentação','Transporte','Moradia','Saúde','Lazer','Educação','Assinaturas','Compras','Outros'];
const CORES_B = ['#2563eb', '#7c3aed', '#db2777', '#ea580c', '#16a34a', '#0891b2', '#ca8a04', '#475569'];

const db = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
const $ = id => document.getElementById(id);
let banco = localStorage.getItem('banco') || '';
let forma = localStorage.getItem('forma') || 'saldo';
let cat = '';
let nomesMeios = [];
let bancosLista = [];
let historico = [];
let adics = {};
let quem = '';

function hoje(){
  const d = new Date();
  return d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0') + '-' + String(d.getDate()).padStart(2,'0');
}
function addMeses(s, n){
  const [y, m, d] = s.split('-').map(Number);
  const t = new Date(y, m - 1 + n, 1);
  const ult = new Date(t.getFullYear(), t.getMonth() + 1, 0).getDate();
  return t.getFullYear() + '-' + String(t.getMonth()+1).padStart(2,'0') + '-' + String(Math.min(d, ult)).padStart(2,'0');
}
const brl = v => Number(v).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
function num(s){
  s = (s || '').trim();
  s = s.includes(',') ? s.replace(/\./g,'').replace(',','.') : s;
  const n = parseFloat(s);
  return isNaN(n) ? 0 : n;
}
function toast(m, erro){
  const t = $('toast');
  t.textContent = m;
  t.className = erro ? 'show erro' : 'show';
  clearTimeout(toast.t);
  toast.t = setTimeout(() => t.className = '', 2500);
}
function chips(el, itens, sel, onSel){
  el.innerHTML = '';
  itens.forEach(n => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip' + (n === sel ? ' on' : '');
    b.textContent = n;
    b.onclick = () => { onSel(n); chips(el, itens, n, onSel); };
    el.appendChild(b);
  });
}

function corLogo(nome){
  let h = 0;
  for(let i = 0; i < nome.length; i++) h = (h * 31 + nome.charCodeAt(i)) >>> 0;
  return CORES_B[h % CORES_B.length];
}
function inicial(nome){
  const p = nome.replace(/^(cart[aã]o|conta)\s+/i, '').trim().split(/\s+/).filter(Boolean);
  const grandes = p.filter(w => w.length > 2);
  if(grandes.length >= 2) return (grandes[0][0] + grandes[1][0]).toUpperCase();
  const w = grandes[0] || p[0] || '?';
  return w.slice(0, 2).toUpperCase();
}
function criarChip(texto, ativo, aoClicar, logoNome, icone, apagado){
  const b = document.createElement('button');
  b.type = 'button';
  b.className = 'chip' + (ativo ? ' on' : '') + (apagado ? ' off' : '');
  if(logoNome){
    const lg = document.createElement('span');
    lg.className = 'lg';
    lg.setAttribute('data-logo', logoNome);
    lg.style.background = corLogo(logoNome);
    lg.textContent = inicial(logoNome);
    b.appendChild(lg);
  } else if(icone){
    const i = document.createElement('i');
    i.className = 'ti ti-' + icone;
    b.appendChild(i);
  }
  b.appendChild(document.createTextNode(texto));
  b.onclick = aoClicar;
  return b;
}

function temCredito(b){ return nomesMeios.includes('Cartão ' + b); }
function ajustarForma(){
  if(banco === 'Dinheiro') forma = 'saldo';
  else if(forma === 'credito' && !temCredito(banco)) forma = 'saldo';
}
function meioAtual(){
  if(!banco) return '';
  if(banco === 'Dinheiro') return 'Dinheiro';
  return (forma === 'credito' ? 'Cartão ' : 'Conta ') + banco;
}
function salvarEscolha(){
  localStorage.setItem('banco', banco);
  localStorage.setItem('forma', forma);
}
function bancoDeMeio(n){
  if(n === 'Dinheiro') return {b: 'Dinheiro', f: 'saldo'};
  let r = /^cart[aã]o\s+(.+)$/i.exec(n);
  if(r) return {b: r[1], f: 'credito'};
  r = /^conta\s+(.+)$/i.exec(n);
  if(r) return {b: r[1], f: 'saldo'};
  return null;
}

function desenharBancos(){
  const box = $('bancos');
  box.innerHTML = '';
  if(!bancosLista.length){
    const v = document.createElement('div');
    v.className = 'mut';
    v.style.textTransform = 'none';
    v.textContent = 'Nenhuma conta ainda. Adicione em Início, em "Minhas contas".';
    box.appendChild(v);
    return;
  }
  bancosLista.forEach(b => {
    box.appendChild(criarChip(b, b === banco, () => {
      banco = b;
      ajustarForma();
      salvarEscolha();
      desenharBancos();
      desenharFormas();
    }, b === 'Dinheiro' ? null : b, b === 'Dinheiro' ? 'cash' : null, false));
  });
}
function desenharFormas(){
  const box = $('formas');
  box.innerHTML = '';
  if(!banco) return;
  if(banco !== 'Dinheiro'){
    const cred = temCredito(banco);
    box.appendChild(criarChip('Crédito', forma === 'credito', () => {
      if(!cred) return toast('Esta conta não tem cartão de crédito cadastrado', true);
      forma = 'credito';
      salvarEscolha();
      desenharFormas();
    }, null, 'credit-card', !cred));
  }
  box.appendChild(criarChip(banco === 'Dinheiro' ? 'Dinheiro em mãos' : 'Saldo da conta', forma === 'saldo', () => {
    forma = 'saldo';
    salvarEscolha();
    desenharFormas();
  }, null, 'wallet', false));
}
function desenharCats(){
  chips($('cats'), CATEGORIAS, cat, n => cat = n);
}

async function carregarBancos(){
  const m = await db.from('meios_pagamento').select('nome').order('nome');
  if(m.error){ toast('Erro: ' + m.error.message, true); return; }
  nomesMeios = m.data.map(x => x.nome);
  const c = await db.from('contas').select('nome').order('nome');
  const set = new Set(c.error ? [] : c.data.map(x => x.nome.replace(/^(cart[aã]o|conta)\s+/i, '').trim()));
  nomesMeios.forEach(n => {
    const r = /^(cart[aã]o|conta)\s+(.+)$/i.exec(n);
    if(r) set.add(r[2]);
  });
  if(nomesMeios.includes('Dinheiro')) set.add('Dinheiro');
  bancosLista = [...set].sort((a, b) => a.localeCompare(b, 'pt-BR'));
  const ad = await db.from('cartoes_adicionais').select('cartao_principal,titular').order('titular');
  adics = {};
  if(!ad.error) ad.data.forEach(x => { (adics[x.cartao_principal] = adics[x.cartao_principal] || []).push(x.titular); });
  if(!bancosLista.includes(banco)) banco = bancosLista[0] || '';
  ajustarForma();
  desenharBancos();
  desenharFormas();
}

async function garantirMeio(nome){
  if(nomesMeios.includes(nome)) return true;
  const r = await db.from('meios_pagamento').insert({nome: nome});
  if(r.error && r.error.code !== '23505'){
    toast('Erro: ' + r.error.message, true);
    return false;
  }
  nomesMeios.push(nome);
  return true;
}

async function carregarHistorico(){
  const r = await db.from('gastos')
    .select('descricao,categoria,meio_pagamento,valor,origem')
    .not('descricao', 'is', null).eq('parcela_numero', 1).eq('tipo', 'variavel')
    .order('data', {ascending:false}).limit(600);
  if(r.error) return;
  const m = new Map();
  r.data.forEach(x => {
    const d = (x.descricao || '').trim();
    if(!d) return;
    const k = d.toLowerCase();
    const e = m.get(k);
    if(e){ e.n++; if(x.origem === 'manual') e.manual = true; }
    else m.set(k, {desc: d, cat: x.categoria, meio: x.meio_pagamento, valor: Number(x.valor), n: 1, manual: x.origem === 'manual'});
  });
  historico = [...m.values()];
}

function sugerir(){
  const q = $('desc').value.trim().toLowerCase();
  const box = $('sugestoes');
  box.innerHTML = '';
  let lista;
  if(!q){
    lista = historico.filter(h => h.manual).sort((a, b) => b.n - a.n).slice(0, 5);
  } else {
    lista = historico
      .filter(h => h.desc.toLowerCase().includes(q) && h.desc.toLowerCase() !== q)
      .sort((a, b) => {
        const pa = a.desc.toLowerCase().startsWith(q) ? 0 : 1;
        const pb = b.desc.toLowerCase().startsWith(q) ? 0 : 1;
        return pa - pb || b.n - a.n;
      })
      .slice(0, 5);
  }
  lista.forEach(h => {
    const b = document.createElement('button');
    b.type = 'button';
    b.className = 'chip';
    b.textContent = h.desc + ' · ' + brl(h.valor);
    b.onmousedown = e => e.preventDefault();
    b.onclick = () => aplicar(h);
    box.appendChild(b);
  });
}

function aplicar(h){
  $('desc').value = h.desc;
  if(CATEGORIAS.includes(h.cat)){ cat = h.cat; desenharCats(); }
  const x = bancoDeMeio(h.meio);
  if(x && bancosLista.includes(x.b)){
    banco = x.b;
    forma = x.f;
    ajustarForma();
    salvarEscolha();
    desenharBancos();
    desenharFormas();
  }
  if(!$('valor').value.trim()) $('valor').value = String(h.valor).replace('.', ',');
  $('sugestoes').innerHTML = '';
}

async function resumo(){
  const ini = hoje().slice(0,8) + '01';
  const fim = addMeses(ini, 1);
  $('mesLabel').textContent = new Date().toLocaleDateString('pt-BR', {month:'long', year:'numeric'});
  const a = await db.from('gastos').select('valor').gte('data', ini).lt('data', fim);
  if(!a.error) $('total').textContent = brl(a.data.reduce((s, x) => s + Number(x.valor), 0));

  const b = await db.from('gastos')
    .select('id,data,valor,categoria,meio_pagamento,descricao,parcelas,parcela_numero')
    .order('data', {ascending:false}).order('criado_em', {ascending:false}).limit(8);
  const lista = $('lista');
  lista.innerHTML = '';
  if(b.error){ lista.textContent = 'Erro ao carregar a lista.'; return; }
  if(!b.data.length){ lista.textContent = 'Nenhum gasto ainda.'; return; }
  b.data.forEach(g => {
    const [y, m, d] = g.data.split('-');
    const item = document.createElement('div');
    item.className = 'item';
    item.style.cursor = 'pointer';
    item.onclick = () => abrirEdicao(g.id, () => { resumo(); carregarHistorico(); });
    const esq = document.createElement('div');
    const l1 = document.createElement('div');
    l1.textContent = g.categoria + ' · ' + g.meio_pagamento;
    const l2 = document.createElement('small');
    let t = d + '/' + m;
    if(g.parcelas > 1) t += ' · ' + g.parcela_numero + '/' + g.parcelas;
    if(g.descricao) t += ' · ' + g.descricao;
    l2.textContent = t;
    esq.appendChild(l1); esq.appendChild(l2);
    const dir = document.createElement('div');
    dir.className = 'dir';
    dir.textContent = brl(g.valor);
    item.appendChild(esq); item.appendChild(dir);
    lista.appendChild(item);
  });
}

async function salvar(){
  const v = num($('valor').value);
  if(v <= 0) return toast('Informe o valor', true);
  if(!banco) return toast('Escolha a conta', true);
  if(!cat) return toast('Escolha a categoria', true);
  const meio = meioAtual();
  const n = Math.max(1, parseInt($('parcelas').value) || 1);
  const data = $('data').value || hoje();
  const rec = num($('rec').value);
  const cents = Math.round(v * 100);
  const base = Math.floor(cents / n);
  const resto = cents - base * n;
  const linhas = [];
  for(let i = 1; i <= n; i++){
    linhas.push({
      data: addMeses(data, i - 1),
      valor: (base + (i === 1 ? resto : 0)) / 100,
      categoria: cat,
      tipo: $('tipo').value,
      descricao: $('desc').value.trim() || null,
      meio_pagamento: meio,
      parcelas: n,
      parcela_numero: i,
      recompensa: i === 1 ? rec : 0,
      origem: 'manual'
    });
  }
  $('btnSalvar').disabled = true;
  if(!(await garantirMeio(meio))){ $('btnSalvar').disabled = false; return; }
  const {error} = await db.from('gastos').insert(linhas);
  $('btnSalvar').disabled = false;
  if(error) return toast('Erro: ' + error.message, true);
  toast('Salvo ✓');
  $('valor').value = ''; $('desc').value = ''; $('parcelas').value = 1;
  $('rec').value = ''; $('tipo').value = 'variavel'; $('data').value = hoje();
  $('sugestoes').innerHTML = '';
  cat = '';
  desenharCats();
  resumo();
  carregarHistorico();
}

async function mostrar(){
  const {data} = await db.auth.getSession();
  const logado = !!data.session;
  $('login').hidden = logado;
  $('app').hidden = !logado;
  if(logado){
    $('data').value = hoje();
    desenharCats();
    await carregarBancos();
    resumo();
    carregarHistorico();
  }
}

$('btnLogin').onclick = async () => {
  $('erroLogin').textContent = '';
  const {error} = await db.auth.signInWithPassword({email: $('email').value.trim(), password: $('senha').value});
  if(error) $('erroLogin').textContent = 'E-mail ou senha incorretos';
  else mostrar();
};
$('btnSair').onclick = async () => { await db.auth.signOut(); mostrar(); };
$('btnSalvar').onclick = salvar;
$('desc').addEventListener('input', sugerir);
$('desc').addEventListener('focus', sugerir);
$('desc').addEventListener('blur', () => setTimeout(() => { $('sugestoes').innerHTML = ''; }, 250));

mostrar();
</script>
</body>
</html>
